<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Employee API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        .warning { background: #fff3cd; border: 1px solid #ffc107; }
        button { padding: 8px 16px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; background: #007bff; color: white; }
        pre { white-space: pre-wrap; font-size: 12px; max-height: 300px; overflow-y: auto; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🔍 Debug Dashboard Employee - API Affectations</h1>

    <div class="step">
        <h3>Étape 1: Test de connexion employee</h3>
        <div>
            <input type="email" id="email" placeholder="Email employee (ex: john.doe@lms.com)" value="john.doe@lms.com">
            <input type="password" id="password" placeholder="Mot de passe" value="password123">
            <button onclick="testLogin()">Se connecter</button>
        </div>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="step">
        <h3>Étape 2: Test API affectations avec token</h3>
        <button onclick="testAffectationsAPI()" id="testApiBtn" disabled>Tester /employee/affectations</button>
        <div id="apiResult" class="result"></div>
    </div>

    <div class="step">
        <h3>Étape 3: Test API debug (sans auth)</h3>
        <button onclick="testDebugAPI()">Tester /employee/debug/affectations</button>
        <div id="debugResult" class="result"></div>
    </div>

    <script>
        let authToken = null;

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            resultDiv.innerHTML = 'Connexion en cours...';
            
            try {
                const response = await fetch('http://localhost:8000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    authToken = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Connexion réussie!</strong><br>
                        Utilisateur: ${data.user?.fullName || 'Unknown'}<br>
                        Email: ${data.user?.email || 'Unknown'}<br>
                        Rôles: ${JSON.stringify(data.user?.roles || [])}<br>
                        Token: ${data.token.substring(0, 20)}...
                    `;
                    document.getElementById('testApiBtn').disabled = false;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ Erreur de connexion:</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Erreur réseau:</strong><br>${error.message}`;
            }
        }

        async function testAffectationsAPI() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.innerHTML = 'Test en cours...';
            
            if (!authToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Pas de token d\'authentification. Connectez-vous d\'abord.';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8000/api/employee/affectations', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ API fonctionne! (${response.status})</strong><br>
                        Cours trouvés: ${data.courses?.length || 0}<br>
                        Quiz trouvés: ${data.quizzes?.length || 0}<br>
                        Ressources trouvées: ${data.resources?.length || 0}<br>
                        <details>
                            <summary>Réponse complète</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ Erreur API ${response.status}:</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Erreur réseau:</strong><br>${error.message}`;
            }
        }

        async function testDebugAPI() {
            const resultDiv = document.getElementById('debugResult');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                const response = await fetch('http://localhost:8000/api/employee/debug/affectations', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Debug API fonctionne! (${response.status})</strong><br>
                        Total affectations: ${data.total_affectations || 0}<br>
                        <details>
                            <summary>Voir toutes les affectations</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ Erreur Debug ${response.status}:</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Erreur réseau:</strong><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
