<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Employee Affectations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>Test API Employee Affectations</h1>
    
    <div>
        <h3>1. Test de la nouvelle API (sans userId):</h3>
        <button class="btn-primary" onclick="testNewAPI()">Tester /employee/affectations</button>
        <div id="result1" class="result"></div>
    </div>

    <div>
        <h3>2. Test de l'API de debug:</h3>
        <button class="btn-secondary" onclick="testDebugAPI()">Tester /employee/debug/affectations</button>
        <div id="result2" class="result"></div>
    </div>

    <script>
        async function testNewAPI() {
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = 'Chargement...';
            
            try {
                // Note: Cette requête échouera car elle nécessite une authentification
                const response = await fetch('http://localhost:8000/api/employee/affectations', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                const text = await response.text();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>Succès (${response.status}):</strong><br><pre>${text}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>Erreur ${response.status}:</strong><br><pre>${text}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Erreur réseau:</strong><br>${error.message}`;
            }
        }

        async function testDebugAPI() {
            const resultDiv = document.getElementById('result2');
            resultDiv.innerHTML = 'Chargement...';
            
            try {
                const response = await fetch('http://localhost:8000/api/employee/debug/affectations', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                const text = await response.text();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    const data = JSON.parse(text);
                    resultDiv.innerHTML = `<strong>Succès (${response.status}):</strong><br>
                        Total affectations: ${data.total_affectations}<br>
                        <details>
                            <summary>Voir détails</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>Erreur ${response.status}:</strong><br><pre>${text}</pre>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>Erreur réseau:</strong><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
