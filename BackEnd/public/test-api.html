<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Affectations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        input { padding: 8px; margin: 5px; width: 100px; }
    </style>
</head>
<body>
    <h1>Test API Affectations</h1>
    
    <div>
        <h3>Test des endpoints:</h3>
        <button onclick="testDebugAffectations()">Debug: Toutes les affectations</button>
        <br>
        <label>User ID: <input type="number" id="userId" value="1" /></label>
        <button onclick="testEmployeeAffectations()">Test affectations employé</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api/employee';
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        // Add authentication if needed
                        // 'Authorization': 'Bearer YOUR_TOKEN'
                    },
                    ...options
                });
                
                const data = await response.text();
                let jsonData;
                try {
                    jsonData = JSON.parse(data);
                } catch (e) {
                    jsonData = { raw_response: data };
                }
                
                return {
                    status: response.status,
                    data: jsonData,
                    ok: response.ok
                };
            } catch (error) {
                return {
                    status: 0,
                    data: { error: error.message },
                    ok: false
                };
            }
        }
        
        function showResult(title, result) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result ' + (result.ok ? 'success' : 'error');
            resultDiv.innerHTML = `
                <h4>${title}</h4>
                <p><strong>Status:</strong> ${result.status}</p>
                <pre>${JSON.stringify(result.data, null, 2)}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function testDebugAffectations() {
            const result = await makeRequest(`${API_BASE}/debug/affectations`);
            showResult('Debug: Toutes les affectations', result);
        }
        
        async function testEmployeeAffectations() {
            const userId = document.getElementById('userId').value;
            const result = await makeRequest(`${API_BASE}/affectations/${userId}`);
            showResult(`Affectations pour l'employé ${userId}`, result);
        }
    </script>
</body>
</html>
